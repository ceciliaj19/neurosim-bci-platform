[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neurosim"
version = "0.1.0"
description = "Interactive computational neuroscience and BCI simulation platform."
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Cecilia Jia" }
]

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "streamlit",
    "plotly"
]

[tool.setuptools.packages.find]
include = ["neurosim*"]